name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'app.js'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'public/**'
      - 'app.js'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Upload frontend files
        uses: actions/upload-artifact@v3
        with:
          name: frontend-ui
          path: public/
          retention-days: 30
